<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <circle cx="256" cy="256" r="190" stroke="#1e293b" stroke-width="6" fill="none" />
  <circle cx="256" cy="256" r="140" stroke="#334155" stroke-dasharray="8 8" stroke-width="3" fill="none" />
  <!-- Pulse Line -->
  <path d="M 96 256 L 180 256 L 210 160 L 250 352 L 290 210 L 320 270 L 340 256 L 416 256" 
        stroke="url(#pulse)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <!-- Center Glow Dot -->
  <circle cx="290" cy="210" r="8" fill="#38bdf8" filter="url(#glow)" />
</svg>
